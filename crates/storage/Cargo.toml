[package]
name = "vulcan-storage"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
vulcan-core = { path = "../core" }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
