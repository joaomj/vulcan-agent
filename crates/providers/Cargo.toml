[package]
name = "vulcan-providers"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
vulcan-core = { path = "../core" }
vulcan-llm = { path = "../llm" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
reqwest = { version = "0.12", features = ["json", "stream"] }
tracing = "0.1"
